# Suivi des joueurs en direct : on garde une piste « perdue » 8 s (80 images à 10 im/s)
# pour qu'un joueur caché derrière un autre retrouve le même identifiant, donc son numéro.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 80
match_thresh: 0.8
fuse_score: True
